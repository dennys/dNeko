name: dNeko

on:
  push:
    branches: ["*"]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# 同一個分支只留最新一次跑；PR 再推就掐掉還在跑的舊的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 與 dHealth / 開發機一致（Flutter 3.47.9 / JDK 21）；升版只改這兩行
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "21"

jobs:
  # 以前是「Setup Environment」+「Run Tests」兩個 job：第一個只做 pub get 並吐一個寫死的
  # 版本字串，第二個又重 checkout + 重 pub get。收進同一個 job，並補上以前完全沒有的
  # Android build —— 本地踩過的 aapt2 / AOT / strip 這類問題，只有真的 build 才抓得到。
  ci:
    name: analyze / test / build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub and gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      # 目前 9 個測試檔都沒載入 sqflite；這步是預防性保留（體積小），
      # 避免日後 host 端測試用到 sqlite3 FFI 時才來修 CI。
      - name: Install system packages
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends libsqlite3-dev

      - name: Run tests
        run: flutter test

      # 固定簽名金鑰（repo secrets：KEYSTORE_B64 = dneko.keystore 的 base64、
      # KEY_PROPERTIES = key.properties 內容）；沒金鑰每版簽名都不同，覆蓋安裝會被系統擋掉。
      # 兩件必做的事（與 dHealth 同步，兩案同一套腳本）：
      # ① secrets 從 GitHub UI 貼進來常帶 \r/\n/空白 —— base64 先把全部空白清掉再解，
      #    key.properties 只去 \r（properties 的內部版面有意義）；
      # ② 寫完立刻預驗，讓「兩個 secret 不配」在這裡就 ::error::，而不是讓 Gradle 兩分鐘後
      #    死在 :app:packageRelease 的 KeytoolException。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEY_PROPERTIES" || { echo "::error::missing secrets KEYSTORE_B64/KEY_PROPERTIES"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/dneko.keystore
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' > android/app/key.properties
          # Properties 允許「storePassword = xx」這種等號前後帶空格的寫法，grep '^storePassword=' 會漏抓
          prop(){ sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" android/app/key.properties | head -1 | tr -d '\r'; }
          PW=$(prop storePassword); KP=$(prop keyPassword); ALIAS=$(prop keyAlias)
          # 三行都要有：build.gradle.kts 是 getProperty 直接讀，少一行會拿到 null，
          # 到 :app:packageRelease 才炸就很難猜，在這裡就報清楚。
          test -n "$PW" && test -n "$KP" && test -n "$ALIAS" || { echo "::error::KEY_PROPERTIES 需要 storePassword= / keyPassword= / keyAlias= 三行（缺 keyPassword 也算錯）"; exit 1; }
          echo "::add-mask::$PW" # 後續步驟不小心印到時由 GitHub 打碼
          echo "::add-mask::$KP"
          # 2026-11-09 換發過鑰：舊共用鑰的密碼曾以明文 commit 進這個 public repo
          # （dNeko 600ae0f 加入、cbb8e26 移除；dHealth 亦然），那把鑰永久作廢。
          # 該密碼早已公開於歷史 commit，寫死在這裡比對不會多洩任何东西。
          if [ "$PW" = "iu6cv1o8k5b7re0d" ] || [ "$KP" = "iu6cv1o8k5b7re0d" ]; then
            echo "::error::用的是 2026-11-09 已作廢的共用鑰密碼（公開 repo 歷史 commit 洩漏）；請改用新鑰，並 KEYSTORE_B64 與 KEY_PROPERTIES 兩個 secrets 一起更新"
            exit 1
          fi
          # 預檢一定要走 JCA —— 跟 Gradle 簽名時同一條路：load(store 密碼) → getKey(alias, key 密碼) → 簽。
          # 不能用 keytool（皆實測於 JDK 21）：
          #   · keytool -list 只驗 store 密碼，keyPassword/keyAlias 打錯照样綠燈；
          #   · keytool -importkeystore -srckeypass 對 PKCS12 同樣驗不到 key 密碼（PKCS12 的 key 是用
          #     store 密碼保護的，-srckeypass 給錯值照样成功）→ 另一種假綠燈。
          # 只有 getKey() 真的拿 keyPassword 去解 key（不對就 UnrecoverableKeyException），
          # 而那正是 :app:packageRelease 在做的事，所以這裡過 = Gradle 那邊也會過。
          JAVA_BIN="${JAVA_HOME:-}/bin/java"
          command -v "$JAVA_BIN" >/dev/null 2>&1 || JAVA_BIN=java # setup-java 有進 PATH，這裡只求穩
          cat > /tmp/KeystorePreflight.java <<'JAVA'
          import java.io.*; import java.security.*; import java.util.Enumeration;
          import java.security.cert.X509Certificate;
          public class KeystorePreflight {
            public static void main(String[] a) throws Exception {
              // argv: keystore 路徑、alias；密碼走環境變數，避免出現在 ps 的 cmdline 上。
              char[] sp = System.getenv("PF_STORE_PW").toCharArray();
              KeyStore ks = KeyStore.getInstance(new File(a[0]), (char[]) null); // 靠 magic 自動判 PKCS12/JKS
              try (InputStream in = new FileInputStream(a[0])) { ks.load(in, sp); }        // 驗 store 密碼
              Key key = ks.getKey(a[1], System.getenv("PF_KEY_PW").toCharArray());        // 驗 key 密碼與 alias
              if (key == null) {
                StringBuilder sb = new StringBuilder();
                for (Enumeration<String> e = ks.aliases(); e.hasMoreElements();) sb.append(' ').append(e.nextElement());
                System.err.println("alias「" + a[1] + "」在 keystore 裡找不到對應的 private key，現有別名:" + sb);
                System.exit(2);
              }
              X509Certificate c = (X509Certificate) ks.getCertificate(a[1]);
              System.out.println("簽章預檢 OK：type=" + ks.getType() + "，" + key.getAlgorithm()
                  + "，憑證簽章 " + c.getSigAlgName() + "，到期 " + c.getNotAfter());
            }
          }
          JAVA
          if ! PF_STORE_PW="$PW" PF_KEY_PW="$KP" "$JAVA_BIN" /tmp/KeystorePreflight.java android/app/dneko.keystore "$ALIAS"; then
            rm -f /tmp/KeystorePreflight.java
            echo "::error::KEYSTORE_B64 與 KEY_PROPERTIES 湊不出能簽名的 key（store 密碼／keyPassword／keyAlias 不對，或 keystore 被剪到）。請重新產生並貼上這兩個 secrets；PKCS12 的 keyPassword 通常要與 storePassword 同值。"
            exit 1
          fi
          rm -f /tmp/KeystorePreflight.java

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      # flutter tool 固定找 app-release.apk，所以 Gradle 輸出名稱不動，
      # 建置完再改名成 dNeko-<mode>-v<version>.apk（版號來自 pubspec）
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          v=$(grep '^version:' ../../../../pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mv app-release.apk "dNeko-release-v$v.apk"
          mv app-debug.apk "dNeko-debug-v$v.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: dennys/dNeko
