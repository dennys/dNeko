# # AndroidX settings
# android.useAndroidX=true
# android.enableJetifier=false
# # 如果外部套件已支援 AndroidX, enableJetifier 設為 false 可減少 Gradle 處理依賴的時間.

# # org.gradle.jvmargs=-Xmx4G
# org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8
# # 分配固定記憶體，避免被系統頻繁回收
# # org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# org.gradle.daemon=true
# org.gradle.parallel=true
# # org.gradle.configuration-cache=true
# org.gradle.configureondemand=true
# org.gradle.caching=true

# # 讓 Gradle Daemon 保持存活 3 小時 (單位為毫秒)
# org.gradle.daemon.idletimeout=10800000

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=false

# 對於 32G 的機器，可以加入以下這行來減少 GC 造成的停頓（ParallelGC 在大量小檔案掃描時有時不如 G1GC 穩定）：
#org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon.idletimeout=3600000

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# Performance settings
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=8

# File system watching (KEY for your issue!)
# org.gradle.vfs.watch 預設開啟 (true), 但在 Windows 上, 若電腦休眠或長時間閒置, 這個監聽機制有時會失效或再重新喚醒時卡住（進行大量 IO 掃描），這就是為什麼你的 log 中顯示 File system watching 耗時 63 秒。
# 設為 false: 優點：解決因為監聽機制「卡住」導致的異常延遲。
# 缺點：每次建置都會有固定的掃描開銷。雖然不會像卡住時那麼久（72秒），但可能無法達到極速（26秒）。
org.gradle.vfs.watch=false
org.gradle.vfs.verbose=false
# org.gradle.configuration-cache=true

# Kotlin optimizations
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=true

# Android build optimizations
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Network timeouts
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
