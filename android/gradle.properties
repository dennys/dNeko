# # AndroidX settings
# android.useAndroidX=true
# android.enableJetifier=false
# # 如果外部套件已支援 AndroidX, enableJetifier 設為 false 可減少 Gradle 處理依賴的時間.

# # org.gradle.jvmargs=-Xmx4G
# org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8
# # 分配固定記憶體，避免被系統頻繁回收
# # org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# org.gradle.daemon=true
# org.gradle.parallel=true
# # org.gradle.configuration-cache=true
# org.gradle.configureondemand=true
# org.gradle.caching=true

# # 讓 Gradle Daemon 保持存活 3 小時 (單位為毫秒)
# org.gradle.daemon.idletimeout=10800000

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=false

# JVM arguments with better GC
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# Performance settings
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=8

# File system watching (KEY for your issue!)
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Kotlin optimizations
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
# Windows 上增量編譯快取常被檔案鎖死（Could not close incremental caches → build 失敗），
# 關掉只慢一點點，換每次都能建置成功。
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.caching.enabled=true

# Android build optimizations
# flutter.gradle 預設會 abiFilters.clear() 並塞回 arm/arm64/x64 三份引擎庫；
# 關掉它的攔截，讓 build.gradle.kts 裡只留 arm64 的設定生效（APK 47MB → 17MB）
disable-abi-filtering=true
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Network timeouts
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
