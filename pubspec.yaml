name: dneko
description: ANeko-like desktop pet app
publish_to: none # app 不發布到 pub.dev（2026-11-16 後已無 path 依賴：flutter_overlay_window 改回 pub.dev 版）
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # flutter_localizations 鎖 intl ^0.20.3；pin 到可解的最高版，避免 any 造成不可重現解析
  intl: ^0.20.3
  sqflite: ^2.4.3 
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.9.2
  # 1.0.x 需要 Gradle 9 / AGP 9 / Java 17（本專案已於階段 40 升級）。
  # 2026-11-16 之前用的是 packages/ 下的本地 fork（為了 ACTION_OUTSIDE「點外面關選單」）；
  # 選單改成第二個懸浮視窗之後那補丁沒人聽了，diff 過上游只差那兩處 → 改回 pub 版。
  # 要恢復那個功能、以及升版要注意的兩條坑：見 AGENTS.md「flutter_overlay_window」。
  flutter_overlay_window: 1.0.2
  package_info_plus: ^10.2.2
  audioplayers: ^6.8.1

dependency_overrides:
  # Linux/aarch64 主機：Google 不發 linux-arm64 主機的 cmake/NDK（x86-64 版執行會報
  # `Syntax error: ")" unexpected`）。path_provider_android 2.3.x 改走 jni/jni_flutter，
  # 會觸發 CMake 原生編譯 → 必敗。釘在最後一個不需要 externalNativeBuild 的版本。
  # 這是「那台主機」的限制，不是本專案的：Windows／CI（x86-64）能編 jni，release 正照常出。
  # 此處釘版是全域生效（CI/Windows 也跟著用 2.2.23）；要讓只有 Linux/aarch64 主機受影响，
  # 改放本機 pubspec_overrides.yaml（dHealth 的作法，已被 .gitignore 擋掉）。
  path_provider_android: 2.2.23

dev_dependencies:
  # analysis_options.yaml 有 include package:flutter_lints/flutter.yaml，
  # 沒列這個依賴時 analyze 會報 include_file_not_found（連自訂 lint 規則都不生效）
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # 請至 pub.dev 確認最新版本
  flutter_test:
    sdk: flutter

flutter:
  generate: true # 啟用 ARB → AppLocalizations 產生
  uses-material-design: true # 打包 MaterialIcons 字型；缺了 Icons.* 全部變成缺字方框
  assets:
    - assets/animals/cat/
    - assets/animals/cat2/
    - assets/animals/dog/
    - assets/animals/penguin/
    - assets/animals/heart_dog/
    - assets/animals/racoon/
    - assets/animals/sloth/
    - assets/animals/monkey/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"