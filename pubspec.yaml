name: dneko
description: ANeko-like desktop pet app

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  dio: ^5.4.0
  flutter_overlay_window: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true # 啟用 ARB → AppLocalizations 產生
  assets:
    - assets/animals/cat/
    - assets/animals/dog/