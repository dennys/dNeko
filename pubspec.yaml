name: dneko
description: ANeko-like desktop pet app

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.3 
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.9.2
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4 # 請至 pub.dev 確認最新版本
  flutter_test:
    sdk: flutter

flutter:
  generate: true # 啟用 ARB → AppLocalizations 產生
  assets:
    - assets/animals/cat/
    - assets/animals/dog/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"